[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnresearch-ai"
version = "0.1.0"
description = "A safety-first vulnerability research prototype"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "cryptography>=43,<47"]
image-signing = ["cryptography>=43,<47"]
gcp = ["google-auth[requests]>=2.35,<3"]

[project.scripts]
vulnresearch = "vulnresearch.cli:main"

[tool.setuptools.packages.find]
include = ["vulnresearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

