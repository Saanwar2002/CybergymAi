name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate example task
        run: vulnresearch validate examples/task.json
      - name: Pull and pin the approved sandbox image
        run: |
          docker pull python:3.11-slim
          image_digest="$(docker image inspect --format='{{index .RepoDigests 0}}' python:3.11-slim)"
          digest="${image_digest##*@}"
          echo "VULNRESEARCH_SANDBOX_IMAGE=python:3.11-slim@${digest}" >> "$GITHUB_ENV"
      - name: Execute harmless offline fixture in Docker
        run: vulnresearch run examples/task.json --allow-execution
      - name: Execute full harmless patch workflow demo in Docker
        run: |
          printf '%s\\n' \\
            "CI reviewer inspected the baseline evidence." \\
            "ACCEPT" \\
            "CI reviewer inspected the passing candidate evidence and accepts the fixture result." \\
            | python examples/demo_workflow.py \\
              --allow-execution \\
              --reviewer "ci-reviewer" \\
              --approval-note "CI explicitly approves the harmless local patch fixture." \\
              --output-dir artifacts/ci-demo
