name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate example task
        run: vulnresearch validate examples/task.json
      - name: Validate offline GCE image reproducibility recipe
        run: vulnresearch validate-image-build-recipe examples/gce-image-reproducibility-recipe.json
      - name: Validate isolated GCP Terraform configuration
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/infra/gcp/canary:/workspace" \
            -w /workspace \
            hashicorp/terraform:1.9.8@sha256:7dbd316397eac07a524394b060d034eb1319eed5e793cff6bd5fe24a1f1f571f \
            -c 'terraform fmt -check -recursive . && terraform init -backend=false -input=false && terraform validate && terraform test -no-color'
      - name: Pull the reviewed, digest-pinned sandbox image
        run: |
          approved_image="python:3.11-slim@sha256:6d10e720318bd84cc3d88af92bb5a47189222e17620a2fd214da6445e4afb679"
          docker pull "$approved_image"
          echo "VULNRESEARCH_SANDBOX_IMAGE=$approved_image" >> "$GITHUB_ENV"
      - name: Execute harmless offline fixture in Docker
        run: vulnresearch run examples/task.json --allow-execution
      - name: Execute full harmless patch workflow demo in Docker
        run: |
          python examples/demo_workflow.py --allow-execution --reviewer "ci-reviewer" --approval-note "CI explicitly approves the harmless local patch fixture." --evidence-review-note "CI reviewed the expected baseline failure evidence." --final-decision accepted --final-note "CI reviewed the passing candidate evidence and accepts the fixture result." --output-dir artifacts/ci-demo
